name: macOS

# Run it by hand from the Actions tab, or with `gh workflow run macOS`. The job
# takes about ten minutes of macOS runner time, which bills at ten times the
# Linux rate, and a day of small pushes spent more of it than the builds were
# worth. Developers build and test locally before pushing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-release:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The tutorial tests replay movement on the server's Training map and look
      # for the server repository beside this one, as in a developer checkout.
      - name: Fetch the server's maps beside the client
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/KikoTs/BattleSpades.git ../BattleSpades
          git -C ../BattleSpades sparse-checkout set maps
          test -f ../BattleSpades/maps/Training.vxl

      - name: Select the C++20-capable Apple toolchain
        # libc++ bundled with Xcode 16 still hides jthread/stop_token behind
        # its experimental library. Xcode 26 ships libc++ 20, where these
        # standard C++20 facilities are supported normally.
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          c++ --version

      - name: Install build tools
        # vcpkg's libsodium port uses autotools on macOS.
        run: brew install cmake ninja autoconf automake libtool

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: macos-15-xcode26-arm64-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            macos-15-xcode26-arm64-vcpkg-

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure and restore dependencies
        run: cmake --fresh --preset native-macos-release

      # Save compiled dependency archives before compiling our sources. A new
      # AppleClang diagnostic must not force the next run to rebuild vcpkg.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: macos-15-xcode26-arm64-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Build and install
        run: |
          cmake --build --preset native-macos-release --parallel
          cmake --install out/build/native-macos-release \
            --config Release \
            --prefix out/install/native-macos-release

      - name: Test the asset importer without retail content
        run: >-
          ctest --test-dir out/build/native-macos-release -C Release
          -R aos_asset_install_tests --output-on-failure

      - name: Test friends, lobbies, discovery, and public relay plumbing
        # These paths previously failed only on macOS: the presence lease was
        # not a canonical UUID, accepting invitations could leave a cached
        # lobby behind, and relay/member convergence had no Apple-side gate.
        # Keep the complete cross-client social boundary in the release job.
        run: >-
          ctest --test-dir out/build/native-macos-release -C Release
          -R 'aos_(friends_lobby|create_match_menu|server_discovery|revival_social|local_server_process|relay_host_tunnel)_tests'
          --output-on-failure

      # aos_text_tests rasterizes the retail Spades font from assets/original,
      # which is imported from an owned game and never present on a runner.
      - name: Test UTF-8 localization
        run: >-
          ctest --test-dir out/build/native-macos-release -C Release
          -R 'aos_(localization_catalog|localization_runtime)_tests'
          --output-on-failure

      - name: Test gameplay inventory, input, and connection recovery
        run: >-
          ctest --test-dir out/build/native-macos-release -C Release
          -R 'aos_(player_inventory|retail_inventory|tutorial_session|local_entity|player_movement|protocol168_session|connection_recovery|deferred_cleanup)_tests'
          --output-on-failure

      - name: Test stable shadow movement and Metal vertex layout
        run: >-
          ctest --test-dir out/build/native-macos-release -C Release
          -R 'aos_(shadow_projection|world_vertex_layout)_tests' --output-on-failure

      - name: Test account-scoped inventory and hosted-result retries
        run: >-
          ctest --test-dir out/build/native-macos-release -C Release
          -R 'aos_(inventory_http|inventory_session_http|hosted_results_http)_tests'
          --output-on-failure

      - name: Verify installed client payload
        shell: bash
        run: |
          test -x out/install/native-macos-release/bin/BattleSpadesClient
          test -x out/install/native-macos-release/bin/BattleSpadesAssetInstaller
          test -f out/install/native-macos-release/bin/asset-manifest.json
          test ! -e out/install/native-macos-release/bin/assets/original
          test -d out/install/native-macos-release/bin/shaders
          test -f out/install/native-macos-release/bin/assets/client/fonts/NotoSansJP-SemiBold.ttf
          test -f out/install/native-macos-release/bin/localization/ru.json
          test -f out/install/native-macos-release/bin/localization/ja.json
          out/install/native-macos-release/bin/BattleSpadesClient --version
          out/install/native-macos-release/bin/BattleSpadesClient --headless --ticks 1
          out/install/native-macos-release/bin/BattleSpadesAssetInstaller --help

      - name: Package launchable macOS application
        shell: bash
        run: |
          app="out/package/BattleSpadesClient.app"
          macos="$app/Contents/MacOS"
          mkdir -p "$macos"
          cp -R out/install/native-macos-release/bin/. "$macos/"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          chmod 755 "$macos/BattleSpadesClient" "$macos/BattleSpadesAssetInstaller"

          # upload-artifact normalizes raw file modes. A tar archive retains
          # the executable bits Finder needs after the user downloads it.
          tar -C out/package -czf out/BattleSpadesClient-macOS-arm64.tar.gz \
            BattleSpadesClient.app

          mkdir -p out/package-smoke
          tar -C out/package-smoke -xzf out/BattleSpadesClient-macOS-arm64.tar.gz
          extracted="out/package-smoke/BattleSpadesClient.app/Contents/MacOS"
          test -x "$extracted/BattleSpadesClient"
          test -x "$extracted/BattleSpadesAssetInstaller"
          "$extracted/BattleSpadesClient" --headless --ticks 1

      - name: Upload unsigned macOS build
        uses: actions/upload-artifact@v4
        with:
          name: BattleSpadesClient-macOS-unsigned
          path: out/BattleSpadesClient-macOS-arm64.tar.gz
          if-no-files-found: error
